# Prüft bei jeder Änderung an tim-kofler.at, ob die Zahl der Beispiele überall stimmt
# (alle Seiten, Meta-Beschreibungen, llms.txt, schwebender Hinweis, Chat) und ob ?v= zu tk-extra.js/tk-ui.js passt.
# Beheben: python3 .github/scripts/beispiele-zaehler.py --schreiben. Der Deploy macht das ohnehin automatisch.

name: Beispiel-Zähler prüfen

on:
  pull_request:
    paths:
      - "webdesign/**"
      - ".github/scripts/beispiele-zaehler.py"
  push:
    branches: [main]
    paths:
      - "webdesign/**"

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/beispiele-zaehler.py
