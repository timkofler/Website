# Veröffentlicht die Webseite per FTPS (verschlüsselt) auf den ALL-INKL-Webspace.
#
# Läuft automatisch bei jeder Änderung auf "main" und kann jederzeit
# manuell gestartet werden: GitHub → Actions → "Webseite veröffentlichen"
# → "Run workflow".
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER      z. B. w0123456.kasserver.com
#   FTP_USERNAME    FTP-Benutzer aus dem KAS
#   FTP_PASSWORD    Passwort dieses FTP-Benutzers
#   FTP_SERVER_DIR  Zielordner auf dem Webspace, z. B. "/"
#
# Es werden nur Dateien hochgeladen bzw. überschrieben, auf dem Webspace wird
# NICHTS gelöscht (Subdomain-Ordner, /logs/, /usage/ usw. bleiben unberührt).

name: Webseite veröffentlichen

on:
  push:
    branches: [main]
    # Änderungen nur an tim-kofler.at (webdesign/) oder an nicht veröffentlichten Ordnern lösen hier keinen
    # Upload aus – die haben ihren eigenen Workflow bzw. landen nie auf dem Webspace.
    paths-ignore:
      - "webdesign/**"
      - "kunden/**"
      - "quellen/**"
      - ".github/workflows/deploy-tim-kofler.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen, ob die FTP-Zugangsdaten hinterlegt sind
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Keine FTP-Zugangsdaten hinterlegt – es wurde nichts veröffentlicht."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Code holen
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: lftp installieren
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTPS hochladen
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          TARGET="${FTP_SERVER_DIR:-/}"
          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          mirror --reverse --verbose --no-perms --parallel=2 \
            --exclude '^\.git/' --exclude '^\.github/' --exclude '^README\.md$' --exclude '^DESIGN\.md$' --exclude '^\.gitignore$' --exclude '^webdesign/' --exclude '^kunden/' --exclude '^quellen/' \
            ./ "$TARGET"
          bye
          EOF
