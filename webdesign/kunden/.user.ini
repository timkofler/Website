; PHP-Grenzen für das Kundenportal (/kunden/ und /kunden/admin/).
; ALL-INKL liest diese Datei automatisch, Änderungen wirken nach etwa 5 Minuten.
; Das Portal zeigt den Kunden die tatsächlich erlaubte Größe an.
upload_max_filesize = 200M
post_max_size = 1024M
max_file_uploads = 100
max_execution_time = 600
max_input_time = 600
