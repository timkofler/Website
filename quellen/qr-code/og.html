<!DOCTYPE html>
<html lang="de-AT" class="tk-black">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/tk.css">
<link rel="stylesheet" href="/assets/css/black.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0b0c; }
  body::before, body::after { display: none !important; }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 0 0 0 72px; display: flex; align-items: center; overflow: hidden;
    background: radial-gradient(620px 520px at 960px 315px, rgba(255,90,31,.16), transparent 70%), #0b0b0c; }
  .og::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #ff5a1f; }
  .og__arc { position: absolute; right: -330px; top: -170px; width: 980px; height: 980px; border-radius: 50%; box-shadow: inset 2px 0 0 rgba(255,122,69,.75), -30px 0 120px -40px rgba(255,90,31,.45); }
  .og__txt { position: relative; z-index: 1; width: 640px; }
  .og .label { font-size: 15px; }
  .og h1 { margin: 20px 0 0; font-size: 64px; line-height: 1.02; max-width: none; }
  .og h1 .lime { display: block; color: #ff5a1f; }
  .og__sub { margin: 24px 0 0; font-size: 22px; line-height: 1.45; color: #bdbdbd; max-width: 31ch; }
  .og__chips { display: flex; gap: 12px; margin-top: 30px; }
  .og__chips span { font: 600 17px var(--mono); padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #eee; background: rgba(255,255,255,.04); }
  .og__chips span:first-child { background: #ff5a1f; color: #0b0b0b; border-color: transparent; }
  .og__qr { position: absolute; z-index: 1; right: 96px; top: 50%; transform: translateY(-50%) rotate(-3deg); width: 330px; padding: 26px 26px 20px; border-radius: 28px; background: #fff;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1), 0 0 80px -20px rgba(255,90,31,.5); }
  .og__qr svg { display: block; width: 100%; height: auto; }
  .og__qr p { margin: 14px 0 0; text-align: center; font: 600 15px var(--mono); color: #3d3832; letter-spacing: .02em; }
  .og__url { position: absolute; right: 56px; bottom: 34px; z-index: 2; font: 500 20px var(--mono); color: #eee; display: flex; align-items: center; gap: 10px; }
  .og__url::before { content: ""; width: 10px; height: 10px; background: #ff5a1f; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="og">
  <div class="og__arc"></div>
  <div class="og__txt">
    <span class="label"><b>[Gratis]</b> QR-Code-Generator</span>
    <h1>QR-Code erstellen. <span class="lime">Läuft nie ab.</span></h1>
    <p class="og__sub">Für Webseite, Speisekarte, WLAN und Google-Bewertungen. Mit Logo, als PNG oder SVG.</p>
    <div class="og__chips"><span>Kostenlos</span><span>Ohne Anmeldung</span><span>Ohne Abo</span></div>
  </div>
  <div class="og__qr"><div id="qr"></div><p>Mit dem Handy scannen</p></div>
  <div class="og__url">tim-kofler.at</div>
</div>
</body>
</html>
